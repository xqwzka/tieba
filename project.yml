name: Tieba
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Tieba:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tieba]
    info:
      path: Tieba/Info.plist
      properties:
        CFBundleDisplayName: 贴吧
        CFBundleVersion: "1"
        # 头像 http 兜底需要：否则 iOS 默认禁明文 http，头像 https 失败时 http 备选也发不出去。
        NSAppTransportSecurity:
          NSExceptionDomains:
            tb.himg.baidu.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            # 发帖凭证 tbs 的 https 请求会被服务端重定向到 http，
            # 不加这两个例外，iOS 会直接以 ATS 错误拦截，回复和发帖一起失败。
            tieba.baidu.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            c.tieba.baidu.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tieba
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
