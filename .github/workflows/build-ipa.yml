name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Tieba.xcodeproj \
            -scheme Tieba \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Tieba.app" Payload/
          zip -r Tieba-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tieba-unsigned-ipa
          path: Tieba-unsigned.ipa

      # Also publish the IPA to a dedicated `builds` branch so it can
      # be fetched without the Actions UI: the raw IPA plus base64
      # parts (60 KB each) and a sha256 manifest for verification.
      - name: Publish IPA to builds branch
        run: |
          cp Tieba-unsigned.ipa /tmp/Tieba-unsigned.ipa
          shasum -a 256 /tmp/Tieba-unsigned.ipa | awk '{print $1}' > /tmp/ipa.sha256
          base64 -i /tmp/Tieba-unsigned.ipa > /tmp/ipa.b64
          split -b 60000 /tmp/ipa.b64 /tmp/ipa_part_
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B builds
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/Tieba-unsigned.ipa .
          cp /tmp/ipa.sha256 .
          cp /tmp/ipa_part_* .
          ls ipa_part_* | wc -l | tr -d ' ' > ipa_parts.count
          git add Tieba-unsigned.ipa ipa.sha256 ipa_parts.count ipa_part_*
          git commit -m "Build Tieba-unsigned.ipa"
          git push origin builds --force
